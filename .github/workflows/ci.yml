name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Real Postgres for the tests (D4); conftest creates and migrates the test database.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ontherecord
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ontherecord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontherecord"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      OTR_TEST_DATABASE_URL: postgresql+psycopg://ontherecord:ci-only@localhost:5432/ontherecord_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
