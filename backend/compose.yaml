# Local Postgres for development and tests (D4). From backend/: `docker compose up -d`.
# Values come from backend/.env (copy .env.example). Tests create their own
# `<db>_test` database on this server.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # localhost only, not the LAN
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
